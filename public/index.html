<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Guimams</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app hub-app">
    <section id="screen-hub" class="screen">
      <div class="platform-logo">
        <span class="platform-logo-icon">🃏</span>
        <span class="platform-logo-text">Guimams</span>
      </div>
      <p class="tagline">Jeux de cartes en ligne, à jouer entre amis</p>

      <div class="game-grid">
        <a href="bataille.html" class="game-preview-card game-preview-card--bataille" style="--stagger: 0">
          <span class="game-preview-badge">⚔️</span>
          <span class="game-preview-name">Bataille</span>
          <span class="game-preview-tagline">Le grand classique</span>
          <span class="game-preview-meta">2 à 4 joueurs</span>
          <span class="game-preview-cta">Jouer <span class="game-preview-cta-arrow">→</span></span>
        </a>
        <a href="rami.html" class="game-preview-card game-preview-card--rami" style="--stagger: 1">
          <span class="game-preview-badge">🎭</span>
          <span class="game-preview-name">Rami</span>
          <span class="game-preview-tagline">Notre variante maison</span>
          <span class="game-preview-meta">2 joueurs</span>
          <span class="game-preview-cta">Jouer <span class="game-preview-cta-arrow">→</span></span>
        </a>
        <a href="ascenseur.html" class="game-preview-card game-preview-card--ascenseur" style="--stagger: 2">
          <span class="game-preview-badge">🛗</span>
          <span class="game-preview-name">L'Ascenseur</span>
          <span class="game-preview-tagline">Annonce tes plis</span>
          <span class="game-preview-meta">3 à 7 joueurs</span>
          <span class="game-preview-cta">Jouer <span class="game-preview-cta-arrow">→</span></span>
        </a>
        <a href="skullking.html" class="game-preview-card game-preview-card--skullking" style="--stagger: 3">
          <span class="game-preview-badge">💀</span>
          <span class="game-preview-name">Skull King</span>
          <span class="game-preview-tagline">10 manches de pirates</span>
          <span class="game-preview-meta">3 à 7 joueurs</span>
          <span class="game-preview-cta">Jouer <span class="game-preview-cta-arrow">→</span></span>
        </a>
      </div>
    </section>
  </main>
</body>
</html>
