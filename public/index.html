<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Guimams</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app">

        <span class="platform-logo-icon">🃏</span>

      <p class="tagline">Choisis un jeu :</p>

      <a href="bataille.html" class="game-preview-card game-preview-card--bataille">

        <span class="game-preview-name">Bataille</span>
        <span class="game-preview-tagline">Le grand classique, de 2 à 4 joueurs</span>
      </a>
      <a href="rami.html" class="game-preview-card game-preview-card--rami">
        <span class="game-preview-mascot">🎭</span>
        <span class="game-preview-name">Rami</span>
        <span class="game-preview-tagline">Notre variante maison, à 2 joueurs</span>
      </a>

</html>
