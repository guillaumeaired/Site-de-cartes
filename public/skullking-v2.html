<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Maquette — Skull King horizontal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Inter:wght@500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    /* =========================================================
       MAQUETTE — Skull King en paysage (ordinateur).
       Même architecture que la maquette Rami, adaptée à un jeu
       de plis à 3-9 joueurs : sièges autour d'une table large,
       pli au centre, tableau des scores enfin lisible à droite.
       Autonome : aucune dépendance à skullking.css / .js.
       ========================================================= */

    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; overflow: hidden; }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      color: #fff;
      background:
        repeating-linear-gradient(45deg, rgba(255,255,255,.015) 0 1px, transparent 1px 4px),
        repeating-linear-gradient(-45deg, rgba(255,255,255,.015) 0 1px, transparent 1px 4px),
        radial-gradient(ellipse at 50% 40%, transparent 30%, rgba(0,0,0,.6) 100%),
        radial-gradient(circle at 50% 12%, #5c1010 0%, transparent 60%),
        linear-gradient(160deg, #2b0a0a, #0a0303);
    }

    .app { height: 100dvh; display: grid; grid-template-rows: auto minmax(0,1fr) auto; }

    /* ================= BARRE DU HAUT ================= */
    .topbar {
      display: flex; align-items: center; gap: 16px; padding: 7px 18px;
      background: rgba(0,0,0,.34); border-bottom: 2px solid rgba(255,255,255,.07);
    }
    .quit {
      background: none; border: none; cursor: pointer; color: #fff; opacity: .7;
      font: inherit; font-size: .85rem; padding: 4px 8px; border-radius: 8px;
    }
    .quit:hover { opacity: 1; background: #ffffff14; }
    .brand {
      font-family: 'Baloo 2', sans-serif; font-weight: 800; font-size: 1.15rem;
      color: #F5C24C; display: flex; align-items: center; gap: 7px;
      text-shadow: 0 2px 0 rgba(0,0,0,.45);
    }
    .phase-pill {
      margin-left: auto; display: flex; align-items: center; gap: 10px;
      font-size: .8rem; font-weight: 700; padding: 5px 15px; border-radius: 999px;
      background: #F5C24C1a; border: 2px solid #F5C24C44; color: #F5C24C;
    }
    .phase-pill .sep { opacity: .4; }

    /* Bandeau de démonstration : permet de juger la mise en page
       à différents nombres de joueurs, ce qui est LE point critique ici. */
    .demo {
      display: flex; align-items: center; gap: 6px; font-size: .68rem;
      padding: 4px 10px; border-radius: 999px;
      background: #ffffff0f; border: 1px dashed #ffffff33;
    }
    .demo b { opacity: .55; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; }
    .demo button {
      font: inherit; font-size: .7rem; font-weight: 700; cursor: pointer;
      width: 22px; height: 22px; border-radius: 6px; color: #fff;
      border: 1px solid #ffffff2e; background: #ffffff14;
    }
    .demo button:hover { background: #ffffff2b; }
    .demo button.on { background: #F5C24C; color: #1a1208; border-color: #1a1208; }

    /* ================= CORPS : TABLE + SCORES ================= */
    .body { display: flex; gap: 12px; padding: 12px 16px 4px; min-height: 0; }

    .table-wrap { flex: 1; min-width: 0; display: flex; }
    .table {
      position: relative; flex: 1; min-height: 0;
      border-radius: 50% / 34%;
      background:
        radial-gradient(ellipse at 50% 45%, rgba(255,255,255,.07), transparent 64%),
        linear-gradient(175deg, rgba(92,16,16,.55), rgba(30,6,6,.6));
      border: 3px solid rgba(0,0,0,.5);
      box-shadow:
        inset 0 0 70px rgba(0,0,0,.45), inset 0 0 0 3px rgba(245,194,76,.2),
        0 8px 26px rgba(0,0,0,.4);
    }

    /* ---- Sièges, placés sur une ellipse ---- */
    .seat {
      position: absolute; transform: translate(-50%,-50%);
      display: flex; flex-direction: column; align-items: center; gap: 3px;
      width: 92px; transition: all .25s;
    }
    .seat-av {
      width: 40px; height: 40px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center; font-size: 1.1rem;
      background: radial-gradient(circle at 35% 30%, #7f1d1d, #3b0a0a);
      border: 2.5px solid #1a1208; box-shadow: 0 3px 0 rgba(0,0,0,.45);
      transition: all .25s;
    }
    .seat.is-turn .seat-av {
      background: radial-gradient(circle at 35% 30%, #fde047, #b45309);
      box-shadow: 0 3px 0 rgba(0,0,0,.45), 0 0 0 5px #F5C24C40;
    }
    .seat-name {
      font-size: .72rem; font-weight: 800; max-width: 92px;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .seat.is-turn .seat-name { color: #F5C24C; }
    /* Annonce / plis gagnés : l'information clé du Skull King, enfin
       visible en permanence sur chaque siège. */
    .seat-bid {
      font-size: .66rem; font-weight: 800; padding: 1px 8px; border-radius: 999px;
      background: #00000055; border: 1px solid #ffffff26;
    }
    .seat-bid.is-hit { background: #16a34a55; border-color: #4ade8088; color: #bbf7d0; }
    .seat-bid.is-over { background: #b91c1c55; border-color: #f8717188; color: #fecaca; }
    .seat-backs { display: flex; }
    .seat-back {
      width: 15px; height: 21px; margin-left: -8px; border-radius: 3px;
      border: 1.5px solid #1a1208;
      background:
        repeating-linear-gradient(45deg, transparent 0 3px, #00000030 3px 4px),
        #3b0a0a;
    }
    .seat-back:first-child { margin-left: 0; }
    .seat.is-me .seat-av { background: radial-gradient(circle at 35% 30%, #F5C24C, #b45309); }

    /* ---- Centre : le pli en cours ---- */
    .trick {
      position: absolute; left: 50%; top: 47%; transform: translate(-50%,-50%);
      display: flex; flex-direction: column; align-items: center; gap: 6px;
      max-width: 74%;
    }
    .trick-cards { display: flex; align-items: flex-end; gap: 8px; flex-wrap: wrap; justify-content: center; }
    .trick-slot { display: flex; flex-direction: column; align-items: center; gap: 3px; }
    .trick-who { font-size: .62rem; font-weight: 700; opacity: .65; }
    .trick-slot.is-winning .trick-who { color: #4ade80; opacity: 1; }
    .trick-caption {
      font-size: .72rem; font-weight: 700; opacity: .75; text-align: center;
      padding: 3px 12px; border-radius: 999px; background: #00000045;
    }

    /* ================= CARTES ================= */
    .card {
      position: relative; border-radius: 8px; flex-shrink: 0;
      border: 2.5px solid #1a1208; box-shadow: 2px 2px 0 rgba(0,0,0,.4);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      font-weight: 800; overflow: hidden; background: #f5f0e6; color: #1a1208;
    }
    .card .big { font-size: var(--big); line-height: 1; }
    .card .lbl {
      font-size: var(--lbl); line-height: 1.05; text-align: center;
      padding: 0 3px; opacity: .9; margin-top: 2px;
    }
    .card .corner {
      position: absolute; top: 3px; left: 4px; font-size: var(--lbl); opacity: .85;
    }
    .card--vert   { background: linear-gradient(155deg,#22c55e,#14532d); color: #f0fdf4; }
    .card--jaune  { background: linear-gradient(155deg,#fde047,#b45309); color: #1a1208; }
    .card--violet { background: linear-gradient(155deg,#c084fc,#581c87); color: #f5f0e6; }
    .card--noir   { background: linear-gradient(155deg,#3a3a3a,#0a0a0a); color: #f5f0e6; }
    .card--special{ background: linear-gradient(155deg,#fffdf6,#e7ddc4); color: #1a1208; }
    .card--sk     { background: linear-gradient(155deg,#1a1208,#000); color: #F5C24C; }

    .card--hand  { width: 84px; height: 118px; --big: 2rem;  --lbl: .58rem; }
    .card--trick { width: 62px; height: 88px;  --big: 1.5rem; --lbl: .5rem; }

    /* ================= PANNEAU DES SCORES ================= */
    .side {
      width: 254px; flex-shrink: 0; display: flex; flex-direction: column; gap: 8px;
      padding: 12px; border-radius: 16px; min-height: 0;
      background: rgba(0,0,0,.3); border: 2px solid rgba(255,255,255,.08);
    }
    .side-title {
      font-size: .58rem; text-transform: uppercase; letter-spacing: 1.5px;
      opacity: .5; font-weight: 800;
    }
    .track { display: flex; gap: 3px; }
    .track i {
      flex: 1; height: 7px; border-radius: 2px; background: #ffffff1a;
      border: 1px solid #ffffff14;
    }
    .track i.done { background: #F5C24C88; }
    .track i.now  { background: #F5C24C; box-shadow: 0 0 8px #F5C24Ccc; }

    .rows { display: flex; flex-direction: column; gap: 4px; overflow-y: auto; min-height: 0; }
    .row {
      display: grid; grid-template-columns: 1fr auto auto; align-items: center; gap: 8px;
      padding: 6px 9px; border-radius: 9px; font-size: .76rem;
      background: #ffffff0d; border: 1px solid transparent;
    }
    .row.is-me { background: #F5C24C1f; border-color: #F5C24C4d; font-weight: 800; }
    .row.is-turn { border-color: #F5C24C99; }
    .row-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .row-bid {
      font-size: .68rem; font-weight: 800; padding: 1px 7px; border-radius: 999px;
      background: #00000055; border: 1px solid #ffffff22;
    }
    .row-bid.is-hit  { background: #16a34a55; border-color: #4ade8088; color: #bbf7d0; }
    .row-bid.is-over { background: #b91c1c55; border-color: #f8717188; color: #fecaca; }
    .row-total { font-weight: 800; color: #F5C24C; min-width: 32px; text-align: right; }
    .side-foot { font-size: .62rem; opacity: .45; line-height: 1.4; }

    /* ================= BAS ================= */
    .bottom { padding: 0 16px 8px; }
    .turnline {
      display: flex; align-items: center; justify-content: center; gap: 10px;
      min-height: 30px; font-size: .82rem; font-weight: 700;
    }
    .actionbar {
      display: flex; align-items: center; justify-content: center; gap: 7px; flex-wrap: wrap;
      width: fit-content; max-width: 100%; margin: 0 auto; padding: 7px 12px; border-radius: 999px;
      background: rgba(26,8,8,.85); border: 2px solid #1a1208;
      box-shadow: 0 5px 0 rgba(0,0,0,.4), 0 0 0 2px #F5C24C4d;
    }
    .btn {
      font: inherit; font-size: .79rem; font-weight: 700; cursor: pointer; white-space: nowrap;
      padding: 7px 14px; border-radius: 999px; border: 2px solid #ffffff28;
      background: #ffffff12; color: #fff; transition: all .15s;
    }
    .btn:hover:not(:disabled) { background: #ffffff26; transform: translateY(-1px); }
    .btn--bid { min-width: 42px; }
    .btn--bid.on { background: #F5C24C; color: #1a1208; border-color: #1a1208; }
    .hint { font-size: .7rem; opacity: .55; }

    .hand { display: flex; align-items: flex-end; justify-content: center; padding-top: 12px; min-height: 132px; }
    .arc { transform-origin: bottom center; margin-left: -26px; flex-shrink: 0; }
    .arc:first-child { margin-left: 0; }
    .card--hand { cursor: pointer; transition: transform .3s cubic-bezier(.34,1.56,.64,1), box-shadow .2s; }
    .card--hand:hover { transform: translateY(-20px) scale(1.06); z-index: 4; }
    .card--hand.is-selected {
      transform: translateY(-24px) scale(1.06);
      box-shadow: 0 0 0 3px #F5C24C, 2px 2px 0 rgba(0,0,0,.4); z-index: 5;
    }
    /* Carte interdite par l'obligation de suivre la couleur */
    .card--hand.is-locked { filter: grayscale(.75) brightness(.6); cursor: not-allowed; }
    .card--hand.is-locked:hover { transform: none; }

    .flag {
      position: fixed; top: 0; left: 50%; transform: translateX(-50%); z-index: 99;
      padding: 3px 14px; font-size: .64rem; font-weight: 800; letter-spacing: 1px;
      text-transform: uppercase; background: #F5C24C; color: #1a1208; border-radius: 0 0 10px 10px;
    }
    .toosmall { display: none; }
    @media (max-width: 1000px) {
      .app { display: none; }
      .toosmall {
        display: flex; height: 100dvh; align-items: center; justify-content: center;
        padding: 32px; text-align: center; font-weight: 600; line-height: 1.6;
      }
    }
  </style>
</head>
<body>
  <div class="flag">Maquette Skull King — non branchée</div>
  <div class="toosmall">
    Maquette paysage prévue pour un écran d'ordinateur.<br />
    Sur téléphone, le jeu gardera sa mise en page verticale actuelle.
  </div>

  <div class="app">
    <header class="topbar">
      <button class="quit">← Quitter</button>
      <div class="brand"><span>💀</span>Skull King</div>
      <div class="demo">
        <b>Démo — joueurs</b>
        <span id="demo-btns"></span>
        <b style="margin-left:8px">phase</b>
        <button id="demo-phase" style="width:auto;padding:0 8px">annonce</button>
      </div>
      <div class="phase-pill" id="phase-pill"></div>
    </header>

    <div class="body">
      <div class="table-wrap">
        <div class="table" id="table">
          <div class="trick" id="trick"></div>
        </div>
      </div>

      <aside class="side">
        <span class="side-title">Manche <span id="round-lbl"></span></span>
        <div class="track" id="track"></div>
        <span class="side-title" style="margin-top:4px">Joueurs — annonce / plis</span>
        <div class="rows" id="rows"></div>
        <span class="side-foot" id="side-foot"></span>
      </aside>
    </div>

    <footer class="bottom">
      <div class="turnline" id="turnline"></div>
      <div class="actionbar" id="actionbar"></div>
      <div class="hand" id="hand"></div>
    </footer>
  </div>

  <script>
    /* ================= État de démonstration ================= */
    const SPECIALS = {
      skullking: { icon:'💀', lbl:'Skull King', cls:'card--sk' },
      pirate:    { icon:'🏴‍☠️', lbl:'Pirate',    cls:'card--special' },
      siren:     { icon:'🧜‍♀️', lbl:'Sirène',    cls:'card--special' },
      escape:    { icon:'🏳️', lbl:'Fuite',      cls:'card--special' },
      tigress:   { icon:'🐯', lbl:'Tigresse',   cls:'card--special' },
      kraken:    { icon:'🦑', lbl:'Kraken',     cls:'card--special' },
      whale:     { icon:'🐋', lbl:'Baleine',    cls:'card--special' },
      loot:      { icon:'💰', lbl:'Butin',      cls:'card--special' },
    };
    const SUIT_DOT = { vert:'🟢', jaune:'🟡', violet:'🟣', noir:'⚫' };
    const NAMES = ['Toi','Mams','Léo','Zoé','Tom','Alix','Sam','Noa','Iris'];

    let nbPlayers = 5;
    let phase = 'bidding';       // 'bidding' | 'playing'
    let myBid = null;
    let selectedCard = null;

    const round = 4, totalRounds = 10, trickNo = 2;

    let players = [];
    function buildPlayers() {
      players = Array.from({ length: nbPlayers }, (_, i) => ({
        id: 'p' + i, name: NAMES[i], me: i === 0,
        bid: [2,1,0,3,1,2,0,1,2][i], tricks: [1,1,0,1,0,0,0,0,1][i],
        score: [120,95,60,140,45,80,30,55,70][i],
        hand: 4,
      }));
    }
    buildPlayers();

    const myHand = [
      { kind:'number', suit:'vert',   value:9 },
      { kind:'number', suit:'vert',   value:3 },
      { kind:'number', suit:'jaune',  value:12 },
      { kind:'number', suit:'noir',   value:7 },
      { kind:'pirate', name:'Harry le Balafré' },
      { kind:'skullking' },
      { kind:'escape' },
    ];
    const trick = [
      { by:1, card:{ kind:'number', suit:'vert', value:11 } },
      { by:2, card:{ kind:'number', suit:'vert', value:5 } },
      { by:3, card:{ kind:'pirate', name:'Rosie d\'Laney' } },
    ];
    const ledSuit = 'vert';

    /* ================= Cartes ================= */
    function cardHTML(c, variant) {
      if (c.kind === 'number') {
        return `<div class="card card--${variant} card--${c.suit}">
            <span class="corner">${SUIT_DOT[c.suit]}</span>
            <span class="big">${c.value}</span>
          </div>`;
      }
      const s = SPECIALS[c.kind] || SPECIALS.escape;
      return `<div class="card card--${variant} ${s.cls}">
          <span class="big">${s.icon}</span>
          <span class="lbl">${c.name || s.lbl}</span>
        </div>`;
    }

    /* ================= Sièges sur une ellipse =================
       Calculé, donc valable pour N'IMPORTE QUEL nombre de joueurs.
       (Le jeu actuel utilise une table figée de 2 à 7 : au-delà, il
       plante — voir la note remise à l'utilisateur.) */
    function seatPos(i, n) {
      const a = (Math.PI / 2) + (i * 2 * Math.PI / n);   // moi en bas
      return [50 + 45 * Math.cos(a), 50 + 39 * Math.sin(a)];
    }

    function renderTable() {
      const t = document.getElementById('table');
      t.querySelectorAll('.seat').forEach(e => e.remove());
      players.forEach((p, i) => {
        const [x, y] = seatPos(i, players.length);
        const el = document.createElement('div');
        el.className = 'seat' + (p.me ? ' is-me' : '') + (i === 3 ? ' is-turn' : '');
        el.style.left = x + '%';
        el.style.top = y + '%';
        const cls = phase === 'playing'
          ? (p.tricks > p.bid ? ' is-over' : p.tricks === p.bid ? ' is-hit' : '')
          : '';
        el.innerHTML = `
          <div class="seat-av">${p.me ? '🫵' : '🏴‍☠️'}</div>
          <span class="seat-name">${p.name}</span>
          <span class="seat-bid${cls}">${phase === 'bidding' ? (i % 2 ? '✓ prêt' : '…') : p.tricks + ' / ' + p.bid}</span>
          <div class="seat-backs">${'<div class="seat-back"></div>'.repeat(Math.min(p.hand, 4))}</div>`;
        t.appendChild(el);
      });
    }

    function renderTrick() {
      const el = document.getElementById('trick');
      if (phase === 'bidding') {
        el.innerHTML = `<span class="trick-caption">🎯 Tout le monde annonce son nombre de plis…</span>`;
        return;
      }
      el.innerHTML = `
        <div class="trick-cards">
          ${trick.map((t, i) => `
            <div class="trick-slot ${i === 2 ? 'is-winning' : ''}">
              <span class="trick-who">${players[t.by].name}${i === 2 ? ' 👑' : ''}</span>
              ${cardHTML(t.card, 'trick')}
            </div>`).join('')}
        </div>
        <span class="trick-caption">Couleur demandée : ${SUIT_DOT[ledSuit]} vert — ${trick.length}/${players.length} cartes jouées</span>`;
    }

    function renderSide() {
      document.getElementById('round-lbl').textContent = `${round} / ${totalRounds}`;
      document.getElementById('track').innerHTML = Array.from({ length: totalRounds }, (_, i) =>
        `<i class="${i + 1 < round ? 'done' : i + 1 === round ? 'now' : ''}"></i>`).join('');

      document.getElementById('rows').innerHTML = [...players]
        .sort((a, b) => b.score - a.score)
        .map((p) => {
          const cls = phase === 'playing'
            ? (p.tricks > p.bid ? ' is-over' : p.tricks === p.bid ? ' is-hit' : '')
            : '';
          return `<div class="row ${p.me ? 'is-me' : ''}">
              <span class="row-name">${p.name}</span>
              <span class="row-bid${cls}">${phase === 'bidding' ? '–' : p.tricks + '/' + p.bid}</span>
              <span class="row-total">${p.score}</span>
            </div>`;
        }).join('');

      document.getElementById('side-foot').textContent = phase === 'bidding'
        ? 'Annonce exacte = 20 pts par pli. Ratée = −10 pts par pli d\'écart.'
        : 'Vert clair = annonce tenue · rouge = déjà dépassée.';
      document.getElementById('phase-pill').innerHTML = phase === 'bidding'
        ? `Manche ${round}/${totalRounds} <span class="sep">·</span> Annonces`
        : `Manche ${round}/${totalRounds} <span class="sep">·</span> Pli ${trickNo}/${round}`;
    }

    /* Doit-on suivre la couleur demandée ? (règle clé du Skull King) */
    const hasLed = () => myHand.some(c => c.kind === 'number' && c.suit === ledSuit);
    function isLocked(c) {
      if (phase !== 'playing') return true;
      if (!hasLed()) return false;
      return c.kind === 'number' && c.suit !== ledSuit;
    }

    function renderBottom() {
      const turn = document.getElementById('turnline');
      const bar = document.getElementById('actionbar');

      if (phase === 'bidding') {
        turn.innerHTML = `<span>🎯 Combien de plis vas-tu remporter cette manche ?</span>`;
        bar.innerHTML = Array.from({ length: round + 1 }, (_, i) =>
          `<button class="btn btn--bid ${myBid === i ? 'on' : ''}" data-bid="${i}">${i}</button>`).join('')
          + `<span class="hint">${myBid === null ? 'Choisis un nombre' : 'Annonce enregistrée — en attente des autres'}</span>`;
        bar.querySelectorAll('[data-bid]').forEach(b => b.onclick = () => { myBid = +b.dataset.bid; renderAll(); });
        return;
      }

      turn.innerHTML = hasLed()
        ? `<span>🟢 À toi de jouer — tu <b>dois suivre le vert</b></span>`
        : `<span>🟢 À toi de jouer — tu n'as pas de vert, tu joues ce que tu veux</span>`;
      const c = selectedCard !== null ? myHand[selectedCard] : null;
      bar.innerHTML = `
        <button class="btn" ${c ? '' : 'disabled'} style="${c ? 'background:#F5C24C;color:#1a1208;border-color:#1a1208' : ''}">
          ▶ Jouer ${c ? (c.kind === 'number' ? c.value + ' ' + SUIT_DOT[c.suit] : (c.name || SPECIALS[c.kind].lbl)) : ''}
        </button>
        <span class="hint">ou clique directement la carte</span>`;
    }

    function renderHand() {
      const el = document.getElementById('hand');
      el.innerHTML = '';
      const n = myHand.length;
      const spread = Math.min(5 * (n - 1), 30);
      myHand.forEach((c, i) => {
        const angle = n > 1 ? -spread / 2 + i * (spread / (n - 1)) : 0;
        const norm = n > 1 ? Math.abs(i - (n - 1) / 2) / ((n - 1) / 2) : 0;
        const arc = document.createElement('div');
        arc.className = 'arc';
        arc.style.transform = `rotate(${angle}deg) translateY(${norm * norm * 12}px)`;
        arc.innerHTML = cardHTML(c, 'hand');
        const card = arc.firstElementChild;
        if (isLocked(c)) card.classList.add('is-locked');
        else if (selectedCard === i) card.classList.add('is-selected');
        if (!isLocked(c)) card.onclick = () => { selectedCard = selectedCard === i ? null : i; renderAll(); };
        el.appendChild(arc);
      });
    }

    /* ================= Contrôles de démo ================= */
    document.getElementById('demo-btns').innerHTML =
      [3,4,5,6,7,8,9].map(n => `<button data-n="${n}">${n}</button>`).join('');
    document.getElementById('demo-btns').onclick = (e) => {
      if (!e.target.dataset.n) return;
      nbPlayers = +e.target.dataset.n; buildPlayers(); renderAll();
    };
    document.getElementById('demo-phase').onclick = () => {
      phase = phase === 'bidding' ? 'playing' : 'bidding';
      document.getElementById('demo-phase').textContent = phase === 'bidding' ? 'annonce' : 'jeu';
      renderAll();
    };

    function renderAll() {
      document.querySelectorAll('#demo-btns button').forEach(b =>
        b.classList.toggle('on', +b.dataset.n === nbPlayers));
      renderTable(); renderTrick(); renderSide(); renderBottom(); renderHand();
    }
    renderAll();
  </script>
</body>
</html>
