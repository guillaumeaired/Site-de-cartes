<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Aperçu du tapis — Skull King</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Cinzel:wght@500;600;700&family=Bitter:wght@500;600;700&family=Spectral:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="skullking.css" />
</head>
<body>
<!--
  Banc d'essai du tapis. Il monte le VRAI écran de jeu — le balisage de
  skullking.html, la vraie feuille de style, le vrai skullking.js — et lui
  sert un état fabriqué à la place du serveur. C'est le seul moyen de
  regarder une disposition de sièges et de cartes sans ouvrir sept
  navigateurs et jouer une manche à la main.

  Le socket est remplacé par un bouchon : skullking.js appelle `io()` à sa
  première ligne, il suffit donc de définir `io` avant de le charger. Rien
  n'est envoyé, rien n'est reçu — l'état est poussé à la main.

    ?n=5            nombre de joueurs (2 à 9)
    ?joues=3        combien ont déjà posé leur carte (défaut : tous)
    ?scene=2        la seconde scène peinte
    ?phase=playing  playing (défaut) | bidding | paused (pli remporté)
                    | fin (l'écran de fin ; &exaequo=4, &loupe=0)
                    | kraken (pli englouti, l'animation part au chargement)
    ?salve=1        la Dernière Salve + la carte en plus de son joueur
    ?planche=cible  la Planche en main, deux Pirates au tapis (désignation)
    ?planche=avale  le même pli résolu, le Pirate poussé par-dessus bord
    ?fige=1300      fige toutes les animations à cet instant (ms), pour capturer
    ?manche=1       la manche 1 pendant l'annonce : la carte de chacun est
                    tournée vers les autres, la mienne face cachée
    ?annonces=1     la révélation des annonces, plaques peintes retournées
    ?tigresse=pirate|fuite   un adversaire pose la Tigresse, annoncée
    ?phase=baleine  la Baleine met les spéciales hors course, sans rien détruire
-->
<script>
const P = new URLSearchParams(location.search);
const N = Math.max(2, Math.min(9, Number(P.get('n') || 5)));
const PHASE = P.get('phase') || 'playing';
// ?phase=kraken : le pli est posé, le Kraken l'a détruit, la pause court.
const KRAKEN = PHASE === 'kraken';
// ?phase=raie : la Raie Tachetée sans aucune numérotée à départager. Elle
// détruit alors le pli, et c'est le cas où l'écran doit NOMMER la coupable —
// des Pirates posés APRÈS elle croient l'emporter (voir PLI_DETRUIT).
const RAIE = PHASE === 'raie';
// ?phase=baleine : la Baleine avec des numérotées à départager. Elle ne
// détruit alors rien — elle met simplement hors course toutes les spéciales,
// et c'est le cas qui règle le voile.
const BALEINE = PHASE === 'baleine';
const TIGRESSE = P.get('tigresse');
const JOUES = P.get('joues') === null ? N : Math.max(0, Math.min(N, Number(P.get('joues'))));
const MANCHE1 = P.get('manche') === '1';

// --- Le bouchon de socket ---------------------------------------------
const auditeurs = new Map();
window.io = () => ({
  connected: true,
  id: 'apercu',
  on(evt, cb) { (auditeurs.get(evt) || auditeurs.set(evt, []).get(evt) || auditeurs.get(evt)).push(cb); },
  emit() {},
});
function emettre(evt, payload) { (auditeurs.get(evt) || []).forEach((cb) => cb(payload)); }

// --- L'état fabriqué ---------------------------------------------------
const PSEUDOS = ['Moi', 'Bérénice', 'Long John', 'Guigui', 'Pablo', 'Anto', 'Mams', 'Rackham', 'Surcouf'];
const JETONS  = ['crane', 'ancre', 'voilier', 'sabre', 'boussole', 'coffre', 'barre', 'crochet', 'bouteille'];
const PIRATES = ['Harry le Géant', 'Juanita Jade', "Rosie la Douce", 'Will le Bandit', 'Rascal le Flambeur'];
const COULEURS = ['tresor', 'violet', 'vert'];

function carte(i) {
  // Un peu de tout : des numérotées, une Fuite, le Skull King, et les cinq
  // Pirates nommés plutôt qu'un seul — ce sont eux qui portent les
  // illustrations peintes une par une, donc ceux qu'on vient regarder quand
  // une planche vient d'être redécoupée.
  // En mode kraken, le 3e joueur pose le Kraken : c'est lui qui engloutit.
  if (KRAKEN && i === 2) return { id: `c${i}`, kind: 'kraken' };
  if (RAIE) return i === 2 ? { id: `c${i}`, kind: 'stingray' } : { id: `c${i}`, kind: 'pirate', name: PIRATES[i % PIRATES.length] };
  if (BALEINE) {
    if (i === 2) return { id: `c${i}`, kind: 'whale' };
    if (i === 0) return { id: `c${i}`, kind: 'skullking' };
    if (i === 1) return { id: `c${i}`, kind: 'pirate', name: PIRATES[1] };
    if (i === 3) return { id: `c${i}`, kind: 'number', suit: 'noir', value: 4 };
    return { id: `c${i}`, kind: 'number', suit: COULEURS[i % 3], value: 3 + ((i * 5) % 11) };
  }
  // ?tigresse=pirate|fuite : le 5e joueur pose la Tigresse, annoncée dans un
  // sens ou dans l'autre. C'est la seule carte qui change de nature en se
  // posant, donc la seule dont l'annonce doit se voir depuis les autres sièges.
  if (TIGRESSE && i === 4) return { id: `c${i}`, kind: 'tigress', chosenAs: TIGRESSE === 'fuite' ? 'escape' : 'pirate' };
  if (i === 3) return { id: `c${i}`, kind: 'escape' };
  if (i === 5) return { id: `c${i}`, kind: 'skullking' };
  if (i < 9) return { id: `c${i}`, kind: 'pirate', name: PIRATES[i % PIRATES.length] };
  return { id: `c${i}`, kind: 'number', suit: COULEURS[i % 3], value: 3 + ((i * 5) % 11) };
}

const joueurs = Array.from({ length: N }, (_, i) => ({
  id: `p${i}`,
  nickname: PSEUDOS[i],
  piece: JETONS[i],
  connected: true,
  handCount: 6,
  tricksWon: i % 3,
  hasBid: true,
  bid: 2,
}));

// `?planche=cible` : deux Pirates déjà posés, la Planche en main, à moi de
// jouer — le cas qui règle la désignation de la cible sur le tapis.
// `?planche=avale` : le même pli, résolu, avec le Pirate poussé par-dessus
// bord — le cas qui règle l'animation.
const PLANCHE = P.get('planche');

// `?salve=1` : le pli contient la Dernière Salve ET la carte supplémentaire
// de son joueur — deux cartes du MÊME joueur, le seul cas où ça se produit.
const SALVE = P.get('salve') === '1';

const pli = SALVE
  ? [
      { playerId: 'p1', card: { id: 's-a', kind: 'number', suit: 'vert', value: 6 } },
      { playerId: 'p0', card: { id: 's-salve', kind: 'lastvolley', ext: true } },
      { playerId: 'p2', card: { id: 's-b', kind: 'number', suit: 'vert', value: 12 } },
      { playerId: 'p3', card: { id: 's-c', kind: 'number', suit: 'vert', value: 4 } },
      // La carte supplémentaire, jouée après tout le monde.
      { playerId: 'p0', card: { id: 's-extra', kind: 'number', suit: 'noir', value: 3 } },
    ]
  : PLANCHE
  ? [
      { playerId: 'p1', card: { id: 'pir1', kind: 'pirate', name: 'Harry le Géant' } },
      { playerId: 'p2', card: { id: 'num1', kind: 'number', suit: 'vert', value: 11 } },
      { playerId: 'p3', card: { id: 'pir2', kind: 'pirate', name: 'Juanita Jade' } },
      ...(PLANCHE === 'avale'
        ? [{ playerId: 'p0', card: { id: 'planche1', kind: 'plank', ext: true, removesId: 'pir2' } }]
        : []),
    ]
  : Array.from({ length: JOUES }, (_, i) => ({ playerId: `p${i}`, card: carte(i) }));

// Manche 1 : le serveur ne m'envoie que l'id de ma carte (kind 'hidden') et
// donne à voir celle de chacun des autres. Voir stateFor.
if (MANCHE1) {
  joueurs.forEach((p, i) => {
    if (i > 0) p.revealedCard = carte(i);
    p.bid = undefined;
    p.hasBid = i % 2 === 0;
  });
}

const etat = {
  phase: MANCHE1 || PHASE === 'bidding' ? 'bidding' : 'playing',
  myId: 'p0',
  isHost: true,
  players: joueurs,
  chat: [],
  leaderPlayerId: 'p1',
  roundNumber: MANCHE1 ? 1 : 6,
  totalRounds: 10,
  cardsInRound: MANCHE1 ? 1 : 6,
  scoreboard: joueurs.map((p, i) => ({ id: p.id, nickname: p.nickname, score: 90 - i * 17, piece: p.piece })),
  extensions: [],
  deckStyle: 'classique',
  lootAllies: [],
  hand: MANCHE1
    ? [{ id: 'c-moi', kind: 'hidden' }]
    : PLANCHE
      ? [{ id: 'ma-planche', kind: 'plank', ext: true }, carte(11), carte(12)]
      : Array.from({ length: 6 }, (_, i) => carte(i + 10)),
  myBid: MANCHE1 ? undefined : 2,
  currentTrick: MANCHE1 ? [] : pli,
  turnPlayerId: PLANCHE ? 'p0' : `p${JOUES % N}`,
  isMyTurn: PLANCHE === 'cible' || JOUES === 0,
  trickNumber: 3,
  leadingPlayerId: 'p1',
  trickWillBeDestroyed: false,
  trickPaused: PHASE === 'paused' || KRAKEN || RAIE || PLANCHE === 'avale',
  // Les cartes que le monstre met hors course : le serveur les calcule (voir
  // resolveTrick), on les nomme ici à la main pour la seule mise en scène.
  trickNeutralisedCardIds: BALEINE ? ['c0', 'c1'] : RAIE ? ['c0', 'c1', 'c3', 'c4'] : [],
  lastTrickResult: PLANCHE === 'avale'
    ? { winnerId: 'p1', destroyed: false, devouredCardIds: [], plankedCardIds: ['pir2'], davyJones: null }
    : KRAKEN
    ? { winnerId: null, destroyed: true, krakenCardId: 'c2', devouredCardIds: [], plankedCardIds: [], davyJones: null }
    : RAIE
    ? { winnerId: null, destroyed: true, krakenCardId: null, destroyedBy: 'stingray', neutralisedCardIds: ['c0', 'c1', 'c3', 'c4'], devouredCardIds: [], plankedCardIds: [], davyJones: null }
    : PHASE === 'paused' ? { winnerId: 'p1', destroyed: false } : null,
  sittingOutThisTrick: false,
};

// --- L'écran de fin, pour régler le récap et la courbe agrandie ---------
// `?phase=fin` monte le classement final au lieu du tapis. `?exaequo=N` fait
// terminer les N premiers joueurs sur le MÊME score : c'est le cas qui règle
// la rangée de médaillons au bout des courbes, et celui qu'on ne rencontre
// jamais en jouant à la main.
const EXAEQUO = Math.max(0, Math.min(N, Number(P.get('exaequo') || 0)));
const MANCHES = 10;

function classementFinal() {
  return joueurs.map((p, i) => {
    const arrivee = i < EXAEQUO ? 140 : 190 - i * 23;
    const curve = Array.from({ length: MANCHES }, (_, m) => ({
      round: m + 1,
      // Des trajets distincts qui convergent : sans ça les lignes se
      // superposent et on ne voit pas ce que la rangée du bout répare.
      total: Math.round((arrivee * (m + 1)) / MANCHES + Math.sin((m + 1) * (i + 1)) * 26),
    }));
    curve[MANCHES - 1].total = arrivee;
    return {
      id: p.id, nickname: p.nickname, piece: p.piece, curve,
      total: arrivee, rounds: MANCHES, exact: 4 + (i % 4), tricks: 12 + i,
    };
  }).sort((a, b) => b.total - a.total);
}

// --- Montage ------------------------------------------------------------
(async () => {
  const html = await (await fetch('skullking.html')).text();
  const doc = new DOMParser().parseFromString(html, 'text/html');
  doc.body.querySelectorAll('script').forEach((s) => s.remove());
  document.body.insertAdjacentHTML('beforeend', doc.body.innerHTML);

  await new Promise((ok, ko) => {
    const s = document.createElement('script');
    s.src = 'skullking.js';
    s.onload = ok; s.onerror = ko;
    document.body.appendChild(s);
  });

  if (PHASE === 'fin') {
    emettre('skullking-state', { ...etat, phase: 'game-end', finalRanking: classementFinal() });
    // La courbe agrandie est ce qu'on vient régler : on l'ouvre d'office.
    if (P.get('loupe') !== '0') document.getElementById('sk-curve-zoom').click();
    document.documentElement.dataset.apercuPret = '1';
    return;
  }

  emettre('skullking-state', etat);

  // La Planche est posée en tête de main : on la clique pour entrer dans la
  // désignation, qui est justement ce qu'on vient regarder.
  if (PLANCHE === 'cible') {
    requestAnimationFrame(() => {
      // Par sa classe d'illustration : la main est triée, la Planche n'est
      // pas forcément la première carte rendue.
      const carte = [...document.querySelectorAll('#sk-hand .sk-card')]
        .find((el) => el.className.includes('planche'));
      if (carte) carte.click();
    });
  }

  // La révélation des annonces se déclenche sur la TRANSITION bidding -> le
  // reste : on sert donc deux états, l'annonce puis le jeu.
  if (P.get('annonces') === '1') {
    emettre('skullking-state', { ...etat, phase: 'bidding', players: joueurs.map((p) => ({ ...p, bid: undefined })) });
    emettre('skullking-state', { ...etat, phase: 'playing', players: joueurs.map((p, i) => ({ ...p, bid: i % 4 })) });
  }

  // ?fige=1300 : arrête toutes les animations à 1300 ms de leur début et les
  // y maintient. Une capture d'écran d'une animation est sinon une loterie —
  // l'horloge virtuelle du navigateur sans tête n'avance pas pendant les
  // chargements, et on ne sait jamais quel instant on a photographié. Là, on
  // demande l'instant qu'on veut voir.
  const FIGE = P.get('fige');
  if (FIGE !== null) {
    const t = Number(FIGE);
    // Deux tours de boucle : les animations du pli sont posées après le
    // rendu, celles qui suivent un `onfinish` ou un délai encore après.
    const figer = () => document.getAnimations().forEach((a) => {
      a.pause();
      try { a.currentTime = t; } catch (e) { /* animation déjà finie */ }
    });
    requestAnimationFrame(() => requestAnimationFrame(() => { figer(); setTimeout(figer, 60); }));
  }

  document.documentElement.dataset.apercuPret = '1';
})();
</script>
</body>
</html>
