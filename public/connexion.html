<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Skull King — Connexion</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Cinzel:wght@500;600;700&family=Bitter:wght@500;600;700&family=Spectral:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="skullking.css" />
  <link rel="stylesheet" href="compte.css" />
</head>
<body>
  <main class="app sk-app">
    <section class="sk-porte">
      <div class="sk-hero">
        <img class="sk-hero-img" src="assets/skin/hero-taverne.webp" alt="" width="1701" height="924" aria-hidden="true" />
      </div>
      <h1 class="sk-home-title">
        <img src="assets/skin/logo-skullking-h.webp" alt="Skull King" width="2057" height="748" />
      </h1>

      <div class="sk-porte-panneau">
        <div class="sk-porte-onglets" role="tablist" aria-label="Connexion ou inscription">
          <button type="button" role="tab" id="porte-onglet-login" aria-selected="true" data-mode="login">J'ai un compte</button>
          <button type="button" role="tab" id="porte-onglet-register" aria-selected="false" data-mode="register">Créer un compte</button>
        </div>

        <form id="porte-form" novalidate>
          <div class="nickname-field">
            <label for="porte-pseudo" class="visually-hidden">Ton pseudo</label>
            <input id="porte-pseudo" name="username" type="text" maxlength="16" placeholder="Ton pseudo" autocomplete="username" autocapitalize="words" required />
          </div>
          <div class="nickname-field">
            <label for="porte-code" class="visually-hidden">Ton code à 4 chiffres</label>
            <input id="porte-code" class="sk-porte-code" name="password" type="password" inputmode="numeric" pattern="[0-9]{4}" maxlength="4" placeholder="Code à 4 chiffres" autocomplete="current-password" required />
          </div>
          <p id="porte-aide" class="sk-porte-aide hidden">Choisis un pseudo et un code à 4 chiffres. Retiens-le bien : il n'y a pas de « code oublié ».</p>
          <button id="porte-valider" type="submit" class="btn btn-primary btn-create">Se connecter</button>
          <p id="porte-erreur" class="error" role="alert"></p>
        </form>

        <div class="divider">ou</div>
        <button id="porte-invite" type="button" class="btn btn-rouge sk-porte-invite">Jouer en invité</button>
        <p class="sk-porte-aide" style="margin: 10px 0 0">En invité, tu joues normalement, mais tes parties ne comptent pas au classement.</p>

        <div class="sk-porte-pied">
          <a href="classement.html" class="btn-rules-link">Voir le classement</a>
        </div>
      </div>
    </section>
  </main>
  <script src="connexion.js"></script>
</body>
</html>
